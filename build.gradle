plugins {
	id 'java'
	id 'org.jetbrains.intellij.platform' version '2.19.0'
}

group = 'com.tool.plugins'
version = '2.0.1'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
	maven { url = 'https://packages.confluent.io/maven/' }
	intellijPlatform {
		defaultRepositories()
	}
}

configurations {
	all*.exclude group: 'org.slf4j', module: 'slf4j-api'
	all*.exclude group: 'org.apache.geronimo.specs', module: 'geronimo-jms_1.1_spec'
	all*.exclude group: 'org.apache.geronimo.specs', module: 'geronimo-jms_2.0_spec'
	all*.exclude group: 'org.jboss.spec.javax.jms', module: 'jboss-jms-api_2.0_spec'
}

dependencies {
	intellijPlatform {
		intellijIdea '2026.2.3'
	}

	compileOnly('org.projectlombok:lombok:1.18.42')
	annotationProcessor('org.projectlombok:lombok:1.18.42')

	testCompileOnly('org.projectlombok:lombok:1.18.42')
	testAnnotationProcessor('org.projectlombok:lombok:1.18.42')

	implementation(group: 'org.apache.commons', name: 'commons-lang3', version: '3.7')
	implementation(group: 'commons-validator', name: 'commons-validator', version: '1.6')

	implementation(group: 'javax.jms', name: 'javax.jms-api', version: '2.0.1')

	implementation(group: 'org.apache.activemq', name: 'artemis-jms-client', version: '1.3.0')

	implementation(group: 'org.apache.activemq', name: 'activemq-client', version: '5.15.4')
	testImplementation(group: 'org.apache.activemq', name: 'activemq-broker', version: '5.15.4')

	implementation(group: 'org.hornetq', name: 'hornetq-jms-client', version: '2.4.7.Final')

	implementation(group: 'io.confluent', name: 'kafka-jms-client', version: '5.0.0') {
		exclude group: 'io.netty', module: 'netty'
	}

	implementation(group: 'com.rabbitmq.jms', name: 'rabbitmq-jms', version: '1.11.1')

	implementation group: 'com.ibm.mq', name: 'com.ibm.mq.allclient', version: '9.2.4.0'

	testImplementation group: 'junit', name: 'junit', version: '4.12'
}

intellijPlatform {
	instrumentCode = true
	pluginConfiguration {
		ideaVersion {
			sinceBuild = '262'
		}
	}
}

test {
	exclude '**/ActiveMQRunner.class'
	exclude '**/*Playground*.class'
}
